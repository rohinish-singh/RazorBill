[project]
name = "razorbill-datasets-incident-detection"
version = "0.1.0"
description = "Offline CP1 manifest and integration tooling"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=7"]
synthetic-video = ["opencv-python-headless>=4.10"]
person1 = ["opencv-python-headless>=4.10", "ultralytics>=8.3", "lap>=0.5.12"]
temporal-action = ["transformers>=4.37,<5"]

[tool.setuptools]
packages = ["behavioral_markers", "datasets_incident_detection", "video_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
